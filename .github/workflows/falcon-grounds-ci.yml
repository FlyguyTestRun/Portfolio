name: falcon-grounds CI

on:
  push:
    branches: [claude/jll-ai-agent-job-plan-kqeri6]
    paths: [jll-t/**]
  pull_request:
    branches: [main]
    paths: [jll-t/**]

defaults:
  run:
    working-directory: jll-t

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jll-t/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          RUNTIME_MODE: local
          PYTHONPATH: src
        run: python -m pytest tests/ -v

  cost-gate:
    name: Cost regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jll-t/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run eval harness (generates cost_log.jsonl)
        env:
          RUNTIME_MODE: local
          PYTHONPATH: src
        run: python eval/run_eval.py

      - name: Enforce cost-per-request threshold
        env:
          RUNTIME_MODE: local
          PYTHONPATH: src
          COST_GATE_THRESHOLD_USD: "0.005"
        run: |
          python - <<'EOF'
          import sys
          import os
          sys.path.insert(0, "src")
          os.environ.setdefault("RUNTIME_MODE", "local")

          from falcon_grounds.observability.cost_attribution import generate_report

          report = generate_report()
          if report.total_requests == 0:
              print("No cost entries found. Nothing to gate.")
              sys.exit(0)

          mean_cost = report.total_cost_usd / report.total_requests
          threshold = float(os.environ.get("COST_GATE_THRESHOLD_USD", "0.005"))

          print(f"Requests evaluated : {report.total_requests}")
          print(f"Total cost (USD)   : ${report.total_cost_usd:.6f}")
          print(f"Mean cost (USD)    : ${mean_cost:.6f}")
          print(f"Gate threshold     : ${threshold:.6f}")
          print(f"Cache hits         : {report.cache_hits}")
          print(f"Pre-route hits     : {report.preroute_hits}")

          if mean_cost > threshold:
              print(f"\nFAIL: cost regression. Mean ${mean_cost:.6f} exceeds threshold ${threshold:.6f}.")
              print("Investigate which layer added cost: check by_layer in the report.")
              for layer, cost in sorted(report.by_layer.items(), key=lambda x: -x[1]):
                  print(f"  {layer:20s} ${cost:.6f}")
              sys.exit(1)

          print(f"\nPASS: mean cost ${mean_cost:.6f} is within threshold ${threshold:.6f}.")
          EOF

      - name: Print full cost report
        if: always()
        env:
          RUNTIME_MODE: local
          PYTHONPATH: src
        run: python scripts/cost_report.py
