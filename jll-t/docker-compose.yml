services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: falcon_grounds
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: falcon_local
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon_grounds"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RUNTIME_MODE: local
      DATABASE_URL: postgresql+psycopg://falcon:falcon_local@postgres:5432/falcon_grounds
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
