[project]
name = "falcon-grounds"
version = "0.1.0"
description = "Governed agentic facilities-management AI reference architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.40",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pinecone-client>=3.0",
    "azure-identity>=1.17",
    "pydantic>=2.6",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "numpy>=1.26",
    "langsmith>=0.1",
    "langchain-community>=0.2",
    "langchain-postgres>=0.0.6",
    "langchain-pinecone>=0.1",
    "langchain-anthropic>=0.1",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_grounds"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
